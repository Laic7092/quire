name: iOS IPA

# 只做一件事：吐出一个未签名的 device .ipa（unsigned），拿去用 Sideloadly /
# AltStore 免费 Apple ID 重签后插线安装，或者越狱设备 / TrollStore 直接装。
#
# 运行：push 到 main，或 Actions 页面手动 Run workflow。

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# 同一个分支上又一次 push 时，前一次还没跑完的就取消：省一台 macOS runner，
# 也省得同时排两条队。
concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Unsigned IPA
    runs-on: macos-latest
    defaults:
      run:
        working-directory: quire
    steps:
      # layx 是 GitHub 上的普通依赖，按 v0.1.0 tag 拉取，不再并排检出。
      - uses: actions/checkout@v7
        with:
          path: quire

      # 缓存的是 Go 的模块和编译结果（GOCACHE）。go.sum 在 quire/ 里，
      # 不写 cache-dependency-path 时 setup-go 在工作区根上找 go.mod，找不到，
      # 于是每次都冷编译——那一步占整个构建的九成时间。
      - uses: actions/setup-go@v7
        with:
          go-version-file: quire/go.mod
          cache-dependency-path: quire/go.sum

      - name: Report Xcode
        run: xcodebuild -version

      - name: Build the unsigned IPA
        run: bash .github/scripts/build-unsigned-ipa.sh

      - uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned-ipa
          path: quire/build/ios-arm64/*-unsigned.ipa
          if-no-files-found: error
