name: iOS IPA

# 只做一件事：吐出一个未签名的 device .ipa（unsigned），拿去用 Sideloadly /
# AltStore 免费 Apple ID 重签后插线安装，或者越狱设备 / TrollStore 直接装。
#
# 运行：push 到 main，或 Actions 页面手动 Run workflow。

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ipa:
    name: Unsigned IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # go.mod 里钉的 mygo CLI 是 v0.6.3，还没有 `-platform ios`。用新版 CLI
      # 单独装一个，App 依赖的 mygo 库版本不动。
      - name: Install the mygo CLI
        run: |
          go install github.com/egoist/mygo/cmd/mygo@v0.10.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Report Xcode
        run: xcodebuild -version

      - name: Build the unsigned IPA
        run: bash .github/scripts/build-unsigned-ipa.sh

      - uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned-ipa
          path: build/ios-arm64/*-unsigned.ipa
          if-no-files-found: error
